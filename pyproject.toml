[project]
name = "squawd"
version = "0.1.0"
description = "Single-drone LLM-piloted UAV simulation and evaluation system"
requires-python = ">=3.10"
dependencies = [
    "mavsdk>=2.0.0",
    "claude-agent-sdk>=0.2.0",
    "numpy",
    "onnxruntime>=1.17",
    "pillow>=10.0",
    "pyyaml",
    "starlette",
    "uvicorn",
    "av>=12.0",
    "openai-codex==0.144.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# Host-GPU deep sidecar (agents/vision/deep; plan §1) — ultralytics pinned per
# codex F7 (YOLO-World set_classes/SAM one-shot API verified on 8.4.103).
deep = ["ultralytics==8.4.103", "torch"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
