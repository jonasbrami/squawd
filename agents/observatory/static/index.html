<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Dronebot Swarm Observatory</title>
<style>
  :root { --bg:#0b1020; --panel:#141b2e; --ink:#dfe6f5; --accent:#5ad1ff; --grid:#23304d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 ui-monospace,Menlo,Consolas,monospace; }
  header { padding:12px 18px; border-bottom:1px solid var(--grid);
           display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; letter-spacing:.5px; }
  header .dot { width:9px; height:9px; border-radius:50%; background:#3ad07a; }
  .wrap { display:flex; gap:16px; padding:16px; align-items:flex-start; }
  .card { background:var(--panel); border:1px solid var(--grid); border-radius:10px; padding:14px; }
  #map { width:560px; height:560px; }
  .legend { display:flex; gap:16px; margin-top:10px; flex-wrap:wrap; }
  .legend span { display:flex; align-items:center; gap:6px; }
  .swatch { width:12px; height:12px; border-radius:3px; }
  #chatcard { width:420px; }
  #chat { height:470px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .msg { background:#0e1626; border-left:3px solid var(--accent); padding:7px 10px; border-radius:6px; }
  .msg b { color:var(--accent); }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:1px; color:#8da2c8; margin:0 0 10px; }
  .meta { color:#8da2c8; font-size:12px; }
</style>
</head>
<body>
<header>
  <span class="dot"></span><h1>DRONEBOT · SWARM OBSERVATORY</h1>
  <span class="meta" id="status">connecting…</span>
</header>
<div class="wrap">
  <div class="card">
    <h2>Live map · top-down (north ↑, east →)</h2>
    <canvas id="map" width="560" height="560"></canvas>
    <div class="legend" id="legend"></div>
  </div>
  <div class="card" id="chatcard">
    <h2>Swarm chat · /swarm/chat</h2>
    <div id="chat"></div>
  </div>
</div>
<script>
const COLORS = ["#5ad1ff","#ff8a5a","#9d7bff","#3ad07a","#ffd65a"];
const RANGE = 90; // metres shown from centre to edge
const cv = document.getElementById("map"), ctx = cv.getContext("2d");
const W = cv.width, H = cv.height, C = W/2;
function toPx(north, east){ // north up, east right
  return [C + (east/RANGE)*C, C - (north/RANGE)*C];
}
function drawGrid(){
  ctx.fillStyle="#0b1020"; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#23304d"; ctx.lineWidth=1;
  for(let m=-RANGE; m<=RANGE; m+=30){
    let [x1,y1]=toPx(m,-RANGE),[x2,y2]=toPx(m,RANGE); ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    let [x3,y3]=toPx(-RANGE,m),[x4,y4]=toPx(RANGE,m); ctx.beginPath();ctx.moveTo(x3,y3);ctx.lineTo(x4,y4);ctx.stroke();
  }
  ctx.strokeStyle="#34507f";
  ctx.beginPath();ctx.moveTo(C,0);ctx.lineTo(C,H);ctx.moveTo(0,C);ctx.lineTo(W,C);ctx.stroke();
  ctx.fillStyle="#8da2c8"; ctx.font="12px monospace";
  ctx.fillText("N",C-4,14); ctx.fillText("S",C-4,H-4); ctx.fillText("E",W-14,C-6); ctx.fillText("W",6,C-6);
}
function drawDrones(drones){
  drones.forEach(d=>{
    if(d.north===null) return;
    const col=COLORS[d.id%COLORS.length];
    const [x,y]=toPx(d.north,d.east);
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,8,0,7); ctx.fill();
    ctx.fillStyle="#dfe6f5"; ctx.font="12px monospace";
    ctx.fillText(`drone_${d.id}`, x+12, y+4);
    ctx.fillStyle="#8da2c8"; ctx.fillText(`${d.alt??"?"}m`, x+12, y+18);
  });
}
function legend(drones){
  document.getElementById("legend").innerHTML = drones.map(d=>
    `<span><i class="swatch" style="background:${COLORS[d.id%COLORS.length]}"></i>drone_${d.id} `+
    `(${d.north??"?"}N, ${d.east??"?"}E, ${d.alt??"?"}m)</span>`).join("");
}
function renderChat(chat){
  const el=document.getElementById("chat");
  el.innerHTML = chat.map(line=>{
    const i=line.indexOf(":");
    const who=i>0?line.slice(0,i):"", rest=i>0?line.slice(i+1):line;
    return `<div class="msg"><b>${who}</b>${rest}</div>`;
  }).join("");
  el.scrollTop = el.scrollHeight;
}
async function tick(){
  try{
    const r = await fetch("/state"); const s = await r.json();
    drawGrid(); drawDrones(s.drones); legend(s.drones); renderChat(s.chat);
    document.getElementById("status").textContent =
      `${s.drones.length} drones · ${s.chat.length} messages · live`;
  }catch(e){ document.getElementById("status").textContent="reconnecting…"; }
}
drawGrid(); setInterval(tick, 500); tick();
</script>
</body>
</html>
