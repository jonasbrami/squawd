<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQUAWD-1 · Cockpit</title>
<style>
  :root{
    --bg:#070b18; --panel:#0e1630; --line:#1e2a52; --line-hi:#2e3f74;
    --txt:#eef2ff; --dim:#a3aede; --faint:#6b76a8;
    --accent:#4cc3ff; --green:#3ddc97; --amber:#ffb454; --red:#ff6b6b;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 var(--sans);
       height:100vh;display:flex;flex-direction:column;overflow:hidden}
  code{font-family:var(--mono);font-size:.85em}

  /* ---------- top bar ---------- */
  header{height:52px;flex:none;display:flex;align-items:center;gap:16px;padding:0 16px;
    background:#0a1128;border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px;letter-spacing:.5px}
  .logo .mark{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),#2b6cff);color:#04101e;font-size:12px;font-weight:900}
  .mode{font-family:var(--mono);font-size:12px;color:var(--dim);border:1px solid var(--line);
    border-radius:6px;padding:4px 10px}
  .mode.g{color:var(--green);border-color:#1d5c42;background:#3ddc9712}
  .dots{display:flex;gap:12px;font-family:var(--mono);font-size:11px;color:var(--faint)}
  .dots span::before{content:"●";margin-right:5px}
  .dots .g{color:var(--green)} .dots .a{color:var(--amber)} .dots .r{color:var(--red)}
  .clock{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim)}
  .btn{font-family:var(--mono);font-weight:700;font-size:13px;border-radius:8px;
    padding:8px 16px;cursor:pointer;letter-spacing:1px;border:1px solid}
  .estop{color:#fff;background:linear-gradient(180deg,#e04848,#a02020);border-color:#ff8888}
  .estop:hover{filter:brightness(1.15)}
  .estop.hit{background:linear-gradient(180deg,#7a1010,#5a0808)}
  .land{color:var(--amber);background:#2a1f08;border-color:#6e5223}
  .land:hover{filter:brightness(1.2)}

  /* ---------- layout ---------- */
  main{flex:1;display:grid;grid-template-columns:1fr 280px;gap:12px;padding:12px;min-height:0}
  .rail{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .card h4{font-size:11px;font-family:var(--mono);color:var(--faint);text-transform:uppercase;
    letter-spacing:1.5px;margin-bottom:8px}

  /* ---------- POV tile ---------- */
  .pov{display:grid;place-items:center;min-height:0}
  .pov-inner{position:relative;aspect-ratio:16/9;max-width:100%;max-height:100%;
    width:100%;border:1px solid var(--line-hi);border-radius:14px;overflow:hidden;
    background:#000;cursor:crosshair}
  canvas.cam,canvas.hud{position:absolute;inset:0;width:100%;height:100%}
  canvas.hud{pointer-events:none}
  .hud-dom{position:absolute;font-family:var(--mono);pointer-events:none}
  .tape{top:0;left:0;right:0;height:30px;display:flex;justify-content:center;align-items:center;
    background:linear-gradient(180deg,#000a,transparent);font-size:11px;color:var(--dim)}
  .tape b{color:var(--txt);font-size:12px;margin:0 6px}
  .trackbanner{top:40px;right:12px;background:#0a1128dd;border:1px solid var(--line-hi);
    border-radius:8px;padding:6px 11px;font-size:11.5px;color:var(--dim);display:none}
  .trackbanner b{display:block;font-size:12.5px}
  .trackbanner.g{color:var(--green);border-color:#1d5c42}
  .trackbanner.a{color:var(--amber);border-color:#6e5223}
  .trackbanner.r{color:var(--red);border-color:#7a2a2a}
  .lockedpill{top:40px;left:12px;right:auto}
  .toast{top:76px;left:50%;transform:translateX(-50%);background:#0a1128ee;
    border:1px solid;border-radius:8px;padding:6px 12px;font-size:12px;display:none}
  .toast.g{color:var(--green);border-color:#1d5c42}
  .toast.a{color:var(--amber);border-color:#6e5223}
  .toast.r{color:var(--red);border-color:#7a2a2a}
  .opsbar{bottom:46px;left:50%;transform:translateX(-50%);display:none;gap:7px;
    align-items:center;background:#0a1128cc;border:1px solid var(--line-hi);
    border-radius:10px;padding:7px 9px;pointer-events:auto}
  .opsbar .rval{font-size:11px;color:var(--dim)}
  .btn.op{font-size:11px;padding:6px 11px;border-radius:7px;letter-spacing:.5px;
    color:var(--accent);background:#0d1836;border-color:var(--line-hi)}
  .btn.op:hover{filter:brightness(1.3)}
  .btn.op:disabled{opacity:.45;cursor:default;filter:none}
  .btn.op.stop{color:var(--red);border-color:#7a2a2a;background:#2a0d0d}
  .btn.op.ghost{color:var(--dim);padding:6px 9px}
  .ripple{position:absolute;border:2px solid var(--accent);border-radius:50%;
    width:10px;height:10px;pointer-events:none;animation:rip .5s ease-out forwards}
  @keyframes rip{from{opacity:.9;transform:translate(-50%,-50%) scale(1)}
    to{opacity:0;transform:translate(-50%,-50%) scale(4.5)}}
  .degraded{top:40px;left:50%;transform:translateX(-50%);background:#2a0d0dee;
    border:1px solid var(--red);border-radius:8px;padding:7px 14px;font-size:13px;
    font-weight:700;color:var(--red);letter-spacing:1px;display:none}
  .ladder{left:12px;top:50%;transform:translateY(-50%);width:64px;height:120px}
  .xh{left:50%;top:50%;transform:translate(-50%,-50%);color:#ffffff90;font-size:22px}
  .beam{left:50%;top:50%;transform:translate(-50%,-50%);border:1.5px dashed var(--faint);
    border-radius:50%;width:9%;aspect-ratio:1;opacity:.9}
  .beam .chip{position:absolute;top:-22px;left:50%;transform:translateX(-50%);
    font-size:10px;background:#0a1128cc;padding:2px 7px;border-radius:4px;
    border:1px solid var(--line);white-space:nowrap;color:var(--dim)}
  .beam.g{border-color:var(--green)} .beam.g .chip{color:var(--green);border-color:#1d5c42}
  .beam.a{border-color:var(--amber)} .beam.a .chip{color:var(--amber);border-color:#6e5223}
  .beam.r{border-color:var(--red)}   .beam.r .chip{color:var(--red);border-color:#7a2a2a}
  .strip{bottom:0;left:0;right:0;display:flex;background:linear-gradient(0deg,#000c,transparent);
    padding:18px 14px 8px;font-size:11px;color:var(--dim)}
  .strip div{margin-right:20px}
  .strip b{color:var(--txt);font-size:13px;display:block}
  .fresh{bottom:38px;left:14px;font-size:10px;color:var(--faint)}
  .fresh.a{color:var(--amber)}
  .novid{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);
    font-family:var(--mono);font-size:12px;text-align:center;padding:20px}

  /* ---------- rail ---------- */
  .map{display:grid;place-items:center}
  .map canvas{width:220px;height:220px}
  .clist{display:flex;flex-direction:column;gap:6px;max-height:170px;overflow:auto}
  .citem{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-family:var(--mono);font-size:11px}
  .citem[data-name]{cursor:pointer}
  .citem[data-name]:hover{border-color:var(--line-hi)}
  .citem.sel{border-color:var(--accent)}
  .citem .id{color:var(--txt);font-weight:700}
  .citem .row{display:flex;justify-content:space-between;color:var(--dim);margin-top:2px}
  .pill{font-size:9.5px;padding:1px 6px;border-radius:4px;border:1px solid}
  .pill.g{color:var(--green);border-color:#1d5c42}
  .pill.a{color:var(--amber);border-color:#6e5223}
  .pill.b{color:var(--accent);border-color:var(--line-hi)}
  .sens{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-family:var(--mono);font-size:10.5px}
  .sens div{background:#0a1128;border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--dim)}
  .sens b{display:block;color:var(--txt);font-size:12px}
  .sens .g b{color:var(--green)} .sens .r b{color:var(--red)} .sens .a b{color:var(--amber)}

  /* ---------- dock (W3b: slim overlay strip — video-first) ---------- */
  .dock{position:fixed;left:0;right:0;bottom:0;height:44px;z-index:10;
    border-top:1px solid var(--line);background:#0a1128d9;
    display:grid;grid-template-columns:1fr 280px;gap:12px;padding:6px 12px}
  .chat{overflow:auto;font-family:var(--mono);font-size:10.5px;display:flex;
    flex-direction:column;gap:2px;padding-right:6px}
  .chat .u{color:var(--accent)} .chat .p{color:var(--green)}
  .chat .e{color:var(--red)} .chat .s{color:var(--faint)}
  .cmd{display:flex;gap:8px;align-items:flex-start}
  .cmd input{flex:1;background:#080d20;border:1px solid var(--line);border-radius:8px;
    color:var(--txt);font-family:var(--mono);font-size:12px;padding:6px 12px;outline:none}
  .cmd input:focus{border-color:var(--accent)}
  .cmd button{background:linear-gradient(135deg,var(--accent),#2b6cff);border:none;
    color:#04101e;font-weight:800;font-family:var(--mono);border-radius:8px;
    padding:6px 16px;cursor:pointer}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="mark">S1</span> SQUAWD-1 <span style="color:var(--faint);font-weight:400">cockpit</span></div>
  <span class="mode" id="mode">—</span>
  <div class="dots">
    <span id="dot-cam" class="r">CAM</span>
    <span id="dot-det" class="r">DET</span>
    <span id="dot-tof" class="">ToF</span>
  </div>
  <span class="clock" id="clock">SIM —</span>
  <button class="btn land" id="btn-land">▼ LAND</button>
  <button class="btn estop" id="btn-estop">■ ESTOP</button>
</header>

<main>
  <!-- ============ POV ============ -->
  <div class="pov">
    <div class="pov-inner" id="pov">
      <canvas class="cam" id="cam"></canvas>
      <canvas class="hud" id="hud"></canvas>
      <div class="novid" id="novid">waiting for video…<br><span id="novid-why"></span></div>
      <div class="hud-dom tape">HDG <b id="t-hdg">—</b> <span id="t-card"></span></div>
      <div class="hud-dom degraded" id="degraded"></div>
      <div class="hud-dom trackbanner" id="trackbanner"></div>
      <div class="hud-dom trackbanner" id="lockedpill"></div>
      <div class="hud-dom toast" id="toast"></div>
      <div class="hud-dom ladder" id="ladder"></div>
      <div class="hud-dom xh">+</div>
      <div class="hud-dom beam" id="beam"><span class="chip" id="beam-chip">ToF —</span></div>
      <div class="hud-dom fresh" id="fresh"></div>
      <div class="hud-dom strip">
        <div>ALT<b id="s-alt">—</b></div>
        <div>SPD<b id="s-spd">—</b></div>
        <div>VS<b id="s-vs">—</b></div>
        <div>BATT<b id="s-batt">—</b></div>
        <div>V<b id="s-volt">—</b></div>
        <div>ARMED<b id="s-arm">—</b></div>
      </div>
      <div class="hud-dom opsbar" id="opsbar">
        <button class="btn op" id="op-orbit">⟳ ORBIT</button>
        <button class="btn op ghost" id="op-rdec" title="orbit radius −5 m">−</button>
        <span class="rval" id="op-rval">R 15 m</span>
        <button class="btn op ghost" id="op-rinc" title="orbit radius +5 m">+</button>
        <button class="btn op" id="op-approach">◀ APPROACH</button>
        <button class="btn op" id="op-backoff">BACK OFF ▶</button>
        <button class="btn op stop" id="op-stop">■ STOP</button>
        <button class="btn op" id="op-resume">↻ RESUME</button>
      </div>
    </div>
  </div>

  <!-- ============ right rail ============ -->
  <div class="rail">
    <div class="card map"><h4>PPI · contacts</h4><canvas id="ppi" width="220" height="220"></canvas></div>
    <div class="card"><h4>Contacts</h4><div class="clist" id="contacts"><div class="citem" style="color:var(--faint)">none</div></div></div>
    <div class="card"><h4>Sensors</h4>
      <div class="sens">
        <div id="sen-cam">CAM<b>—</b></div>
        <div id="sen-det">DET<b>—</b></div>
        <div id="sen-snap">SNAP Δt<b>—</b></div>
        <div id="sen-trk">TRACKED<b>—</b></div>
      </div>
    </div>
  </div>
</main>

<div class="dock">
  <div class="chat" id="chat"></div>
  <div class="cmd">
    <input id="cmd-in" placeholder="command the drone… (enter to send)" autocomplete="off">
    <button id="cmd-send">SEND</button>
  </div>
</div>

<script>
"use strict";
/* SQUAWD-1 cockpit — vanilla JS, no build step.
 * Data flow (ICD §8.2):
 *   WS /ws_cam        -> H.264 AU via WebCodecs; per-AU [seq:u32, stamp:f64] header
 *   WS /ws_detections -> verbatim PerceptionSnapshot v1 JSON (authoritative fusion)
 *   GET /state (2 Hz) -> pose/attitude/mode/battery/health + server-side banner
 *   GET /chat (1 Hz)  -> feed; POST /command; POST /estop
 *   POST /api/lock    click {x,y} frame px -> server hit-test -> /pilot/cmd (W0.3)
 *   POST /api/cmd     locked-object ops (orbit/standoff/stop/resume) -> /pilot/cmd (W3b)
 * The 0.5 s overlay match rule mirrors agents/observatory/overlay.py — keep in sync.
 */
const OVERLAY_MAX_AGE_S = 0.5;              // mirror of overlay.py OVERLAY_MAX_AGE_S
const HFOV_DEG = 69.0;                      // camera SDF hfov (perception/projection.py)
const el = (id) => document.getElementById(id);

const S = {
  state: null,          // last /state JSON
  snap: null,           // last PerceptionSnapshot v1 (parsed)
  lastSeq: 0,
  lastStamp: 0,         // sim_stamp of the newest received access unit
  auTimes: [],          // wall-clock arrival times of recent AUs (fps estimate)
  chatNext: 0,
  hover: null,          // contact under the cursor (client-side preview ONLY)
  hoverKey: null,       // its name (change guard for redraws)
  locked: null,         // contact latched by a 200 from /api/lock (pre-track handoff)
  lockedAt: 0,          // performance.now() of the latch (3 s timeout)
  gap: null,            // last track.gap_m (Approach / Back off baseline)
  orbitR: 15,           // orbit radius stepper (m); R4 default 15 m / 8 dps
  orbit: null,          // {contact, radius_m} while an orbit op is active (PPI ring)
};
let decoder = null;

/* ---------------- video ---------------- */

function isKeyAU(u8) {
  /* Annex-B scan: a keyframe AU from this encoder carries SPS (type 7) before
   * its IDR slice (type 5); a delta AU leads with a non-IDR slice (type 1). */
  for (let i = 0; i + 4 < u8.length; i++) {
    if (u8[i] === 0 && u8[i+1] === 0 && (u8[i+2] === 1 || (u8[i+2] === 0 && u8[i+3] === 1))) {
      const hdr = (u8[i+2] === 1) ? i+3 : i+4;
      if (hdr >= u8.length) break;
      const t = u8[hdr] & 0x1f;
      if (t === 7 || t === 5) return true;
      if (t >= 1 && t <= 5) return false;
    }
  }
  return false;
}

function setupDecoder(codec) {
  if (!("VideoDecoder" in window)) {
    el("novid-why").textContent = "this browser has no WebCodecs VideoDecoder";
    return;
  }
  if (decoder) { try { decoder.close(); } catch (e) {} }
  decoder = new VideoDecoder({
    output: (vf) => { drawFrame(vf); vf.close(); },
    error: (e) => console.warn("VideoDecoder:", e),
  });
  decoder.configure({ codec, optimizeForLatency: true });
}

function drawFrame(vf) {
  const c = el("cam");
  if (c.width !== vf.displayWidth || c.height !== vf.displayHeight) {
    c.width = vf.displayWidth; c.height = vf.displayHeight;
  }
  c.getContext("2d").drawImage(vf, 0, 0);
  el("novid").style.display = "none";
  drawHUD();
}

function connectCam() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws_cam`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => el("dot-cam").className = "a";
  ws.onclose = () => {
    el("dot-cam").className = "r";
    el("novid").style.display = "grid";
    el("novid-why").textContent = "video socket closed — reconnecting";
    setTimeout(connectCam, 1000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      const cfg = JSON.parse(ev.data);       // {seq, sim_stamp, codec} announce
      setupDecoder(cfg.codec);
      return;
    }
    const dv = new DataView(ev.data);
    S.lastSeq = dv.getUint32(0, false);      // [seq:u32 BE, stamp:f64 BE, AU…]
    S.lastStamp = dv.getFloat64(4, false);
    const au = new Uint8Array(ev.data, 12);
    S.auTimes.push(performance.now());
    if (S.auTimes.length > 40) S.auTimes.shift();
    el("dot-cam").className = "g";
    if (decoder && decoder.state === "configured") {
      decoder.decode(new EncodedVideoChunk({
        type: isKeyAU(au) ? "key" : "delta",
        timestamp: Math.round(S.lastStamp * 1e6),
        data: au,
      }));
    }
  };
}

/* ---------------- detections ---------------- */

function connectDet() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws_detections`);
  ws.onopen = () => el("dot-det").className = "a";
  ws.onclose = () => { el("dot-det").className = "r"; setTimeout(connectDet, 1000); };
  ws.onerror = () => ws.close();
  ws.onmessage = (ev) => {
    try {
      S.snap = JSON.parse(ev.data);          // verbatim PerceptionSnapshot v1
      el("dot-det").className = "g";
      if (S.hoverKey)                        // re-resolve hover on the new snap
        S.hover = (S.snap.contacts || []).find(c => c.name === S.hoverKey) || null;
      drawHUD();
      drawContacts();
      drawSensors();
    } catch (e) { /* keep last good snapshot */ }
  };
}

/* ---------------- overlay (mirror of overlay.py) ---------------- */

function overlayFresh() {
  return !!(S.snap && S.lastStamp > 0 && S.snap.sim_stamp > 0 &&
            Math.abs(S.lastStamp - S.snap.sim_stamp) <= OVERLAY_MAX_AGE_S);
}

function healthColor(h) {
  if (h === "MEASURED") return "var(--green)";
  if (h === "COASTING") return "var(--amber)";
  return "var(--accent)";                    // ACQUIRING / bearing-only / LOST
}

function matchContact(det, contacts) {
  /* dets carry no contact id on the wire (v1): join by class, then nearest
   * reported confidence. Unambiguous for the sim's one-mover scenario; a
   * same-class crowd degrades gracefully to "no contact" styling. */
  const cands = (contacts || []).filter(c => c.cls === det.cls);
  if (!cands.length) return null;
  let best = cands[0], bd = Math.abs((best.conf ?? 0) - det.conf);
  for (const c of cands) {
    const d = Math.abs((c.conf ?? 0) - det.conf);
    if (d < bd) { best = c; bd = d; }
  }
  return best;
}

function drawHUD() {
  const hud = el("hud"), cam = el("cam");
  if (!cam.width) return;
  if (hud.width !== cam.width || hud.height !== cam.height) {
    hud.width = cam.width; hud.height = cam.height;
  }
  const ctx = hud.getContext("2d");
  ctx.clearRect(0, 0, hud.width, hud.height);

  const snap = S.snap, fresh = overlayFresh();
  const fn = el("fresh");
  if (snap && !fresh) {                      // stale overlay: dropped, said so
    const dt = Math.abs(S.lastStamp - snap.sim_stamp).toFixed(1);
    fn.textContent = `overlay dropped — snapshot stale (Δt=${dt}s > ${OVERLAY_MAX_AGE_S}s)`;
    fn.className = "hud-dom fresh a";
  } else if (snap) {
    fn.textContent = `overlay Δt=${Math.abs(S.lastStamp - snap.sim_stamp).toFixed(2)}s`;
    fn.className = "hud-dom fresh";
  } else {
    fn.textContent = "no perception snapshot yet";
    fn.className = "hud-dom fresh";
  }
  updateBeam(fresh ? snap : null);
  updateTrackBanner(fresh ? snap : null);
  updateLockUI(fresh ? snap : null);
  if (!fresh) return;

  const sx = hud.width / (snap.frame_w || hud.width);
  const sy = hud.height / (snap.frame_h || hud.height);
  for (const d of snap.dets || []) drawDet(ctx, d, snap, sx, sy);
  if (S.hover && S.hover.name !== curTarget()) drawHoverBox(ctx, S.hover, sx, sy);
}

function drawDet(ctx, d, snap, sx, sy) {
  const c = matchContact(d, snap.contacts);
  const color = healthColor(c ? c.health : null);
  const [x1, y1, x2, y2] = d.xyxy.map((v, i) => v * (i % 2 ? sy : sx));
  const tgt = curTarget();                   // latched lock (W3b) or track.target
  const designated = tgt && c && c.name === tgt;

  ctx.strokeStyle = color;
  ctx.lineWidth = designated ? 2.5 : 1.6;
  ctx.setLineDash(c ? [] : [5, 4]);          // no contact view => dashed box
  ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
  ctx.setLineDash([]);

  const label = `${c ? c.name : "det"} · ${d.cls} · ${(d.conf ?? 0).toFixed(2)}`;
  ctx.font = "11px ui-monospace, Menlo, monospace";
  const lw = ctx.measureText(label).width + 10;
  ctx.fillStyle = "#041a10d0";
  ctx.fillRect(x1, Math.max(0, y1 - 18), lw, 16);
  ctx.fillStyle = color;
  ctx.fillText(label, x1 + 5, Math.max(11, y1 - 6));

  /* range readout + src chip + range_conf bar (design §3.7: absence of a
   * valid range reads RANGE UNAVAILABLE, never empty space) */
  let rng, conf = 0;
  if (c && c.range_m != null) {
    rng = `${c.range_m.toFixed(0)} m · ${c.range_src || "?"}`;
    conf = Math.max(0, Math.min(1, c.range_conf ?? 0));
  } else {
    rng = "RANGE UNAVAILABLE";
  }
  const rw = ctx.measureText(rng).width + 10;
  ctx.fillStyle = "#0a1128d0";
  ctx.fillRect(x1, y2 + 2, Math.max(rw, 46), 22);
  ctx.fillStyle = "var(--txt)";
  ctx.fillText(rng, x1 + 5, y2 + 16);
  ctx.fillStyle = "#18224a";
  ctx.fillRect(x1 + 5, y2 + 18, Math.max(rw, 46) - 10, 3);
  ctx.fillStyle = color;
  ctx.fillRect(x1 + 5, y2 + 18, (Math.max(rw, 46) - 10) * conf, 3);

  if (designated) drawReticle(ctx, x1, y1, x2, y2, color);
}

function drawReticle(ctx, x1, y1, x2, y2, color) {
  /* Latched-lock reticle (W3b, design v0.3 §5): corner brackets + a pulsing
   * ring around the designated contact's box. */
  const k = Math.max(8, Math.min(x2 - x1, y2 - y1) * 0.25);
  const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (const [px, py, dx, dy] of [[x1, y1, 1, 1], [x2, y1, -1, 1],
                                  [x1, y2, 1, -1], [x2, y2, -1, -1]]) {
    ctx.moveTo(px + dx * k, py); ctx.lineTo(px, py); ctx.lineTo(px, py + dy * k);
  }
  ctx.stroke();
  const t = performance.now() / 1000;
  ctx.globalAlpha = 0.55 + 0.3 * Math.sin(t * 4);
  ctx.beginPath();
  ctx.arc(cx, cy, Math.max(x2 - x1, y2 - y1) * (0.6 + 0.07 * Math.sin(t * 4)), 0, 7);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawHoverBox(ctx, c, sx, sy) {
  /* Client-side hover preview ONLY (thin dashed outline + class label) — the
   * authoritative click hit-test stays server-side (/api/lock, W0.3). */
  if (!c.bbox_xyxy || c.bbox_xyxy.length !== 4) return;
  const [x1, y1, x2, y2] = c.bbox_xyxy.map((v, i) => v * (i % 2 ? sy : sx));
  ctx.strokeStyle = "#4cc3ff";
  ctx.lineWidth = 1.2;
  ctx.setLineDash([4, 3]);
  ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
  ctx.setLineDash([]);
  ctx.font = "10px ui-monospace, Menlo, monospace";
  ctx.fillStyle = "#4cc3ff";
  ctx.fillText(c.cls || "?", x1 + 4, Math.max(10, y1 + 12));
}

/* ---------------- beam + track + ladder (DOM) ---------------- */

function beamClass(status) {
  if (!status || status === "IDLE") return "";
  if (status === "LOCKED" || status === "ASSOCIATED") return "g";
  if (status === "SEARCHING" || status === "ACQUIRING" || status === "DESIGNATED") return "a";
  return "r";                                // NO-RETURN / EDGE-MIX / OUT-OF-ENVELOPE / slips
}

function updateBeam(snap) {
  const st = snap && snap.beam ? (snap.beam.status || "IDLE") : null;
  el("beam").className = "hud-dom beam " + (snap ? beamClass(st) : "");
  el("beam-chip").textContent = snap ? `ToF ${st || "—"}` : "ToF —";
  const rng = snap && snap.beam && snap.beam.range_m;
  el("dot-tof").className = beamClass(st) || "";
  el("dot-tof").textContent = rng ? `ToF ${rng.toFixed(0)}m` : "ToF";
}

function updateTrackBanner(snap) {
  const t = snap && snap.track;
  const b = el("trackbanner");
  if (!t || !t.state || t.state === "IDLE") { b.style.display = "none"; return; }
  const cls = (t.state === "WORLD_TRACKED" || t.state === "RANGE_LOCKED") ? "g"
            : (t.state === "LOST") ? "r" : "a";
  b.className = "hud-dom trackbanner " + cls;
  b.style.display = "block";
  const gap = t.gap_m != null ? ` · gap ${t.gap_m.toFixed(1)} m` : "";
  b.innerHTML = `<b>${t.state}</b>${t.target || "—"}${gap}`;
}

const CARDINALS = ["N","NE","E","SE","S","SW","W","NW"];

function drawLadder() {
  /* mini pitch/roll ladder: 3 bars (±10°, 0) shifting with pitch, the whole
   * widget rolling with the airframe (attitude explains beam-off-target). */
  const st = S.state || {};
  const roll = st.roll ?? 0, pitch = st.pitch ?? 0;
  const px = Math.max(-40, Math.min(40, pitch * 2));       // 2 px/deg, clamped
  let rows = "";
  for (const deg of [10, 0, -10]) {
    const y = 60 + px - deg * 2;
    rows += `<div style="position:absolute;top:${y}px;left:8px;width:48px;
      border-top:1px solid ${deg === 0 ? "var(--amber)" : "var(--faint)"};
      font-size:9px;color:var(--faint)">${deg ? deg + "°" : ""}</div>`;
  }
  el("ladder").innerHTML =
    `<div style="position:absolute;inset:0;transform:rotate(${-roll}deg)">${rows}</div>`;
}

/* ---------------- /state ---------------- */

async function pollState() {
  try {
    const r = await fetch("/state");
    S.state = await r.json();
  } catch (e) { return; }
  const st = S.state, f = (v, u = "") => v == null ? "—" : `${v}${u}`;
  const m = el("mode");
  m.textContent = st.mode || "—";
  m.className = "mode" + (st.armed ? " g" : "");
  el("t-hdg").textContent = f(st.heading, "°");
  el("t-card").textContent = st.heading == null ? "" :
    CARDINALS[Math.round(st.heading / 45) % 8];
  el("s-alt").textContent = f(st.alt, " m");
  el("s-spd").textContent = f(st.speed, " m/s");
  el("s-vs").textContent = f(st.vspeed, " m/s");
  el("s-batt").textContent = st.batt_pct == null ? "—" : st.batt_pct + " %";
  el("s-volt").textContent = f(st.voltage, " V");
  el("s-arm").textContent = st.armed == null ? "—" : (st.armed ? "YES" : "no");
  const dg = el("degraded");
  if (st.banner) { dg.textContent = st.banner; dg.style.display = "block"; }
  else dg.style.display = "none";
  drawLadder();
  drawSensors();
}

function drawSensors() {
  const now = performance.now();
  S.auTimes = S.auTimes.filter(t => now - t < 2000);
  const fps = (S.auTimes.length / 2).toFixed(0);
  el("sen-cam").innerHTML = `CAM<b>${S.lastSeq ? fps + " fps · #" + S.lastSeq : "—"}</b>`;
  el("sen-cam").className = S.lastSeq ? "g" : "r";
  const det = S.snap && S.snap.detector;
  el("sen-det").innerHTML = `DET<b>${det ? (det.healthy ? det.latency_ms + " ms" : "DOWN") : "—"}</b>`;
  el("sen-det").className = det ? (det.healthy ? "g" : "r") : "";
  const dt = (S.snap && S.lastStamp) ? Math.abs(S.lastStamp - S.snap.sim_stamp) : null;
  el("sen-snap").innerHTML = `SNAP Δt<b>${dt == null ? "—" : dt.toFixed(2) + " s"}</b>`;
  el("sen-snap").className = dt == null ? "" : (overlayFresh() ? "g" : "a");
  const n = S.snap && S.snap.contacts ? S.snap.contacts.length : 0;
  el("sen-trk").innerHTML = `TRACKED<b>${S.snap ? n : "—"}</b>`;
}

/* ---------------- contacts card ---------------- */

function drawContacts() {
  const list = (S.snap && S.snap.contacts) || [];
  const box = el("contacts");
  if (!list.length) {
    box.innerHTML = `<div class="citem" style="color:var(--faint)">none</div>`;
    return;
  }
  const tgt = curTarget();
  box.innerHTML = list.map(c => {
    const pc = c.health === "MEASURED" ? "g" : c.health === "COASTING" ? "a" : "b";
    const rng = c.range_m != null ? `${c.range_m.toFixed(1)} m · ${c.range_src}` : "no range";
    const sel = c.name === tgt ? " sel" : "";
    return `<div class="citem${sel}" data-name="${c.name}" title="click to lock"><span class="id">${c.name}</span>
      <span class="pill ${pc}">${c.health || "?"}</span>
      <div class="row"><span>${rng}</span><span>conf ${(c.conf ?? 0).toFixed(2)}</span></div></div>`;
  }).join("");
}

/* ---------------- click-to-lock + locked ops (W3b, design v0.3 §5) ---------------- */

function curTarget() {
  /* The operator's current object of interest: a just-clicked lock latch
   * (until the snapshot's track.target catches up) else the authoritative
   * track target. */
  return S.locked || (S.snap && S.snap.track && S.snap.track.target) || null;
}

function framePx(e) {
  /* CSS px event -> camera-frame px via the canvas' native backing size and
   * bounding rect (also yields pov-relative px for DOM effects). */
  const cam = el("cam"), r = cam.getBoundingClientRect();
  if (!cam.width || !r.width) return null;
  return { x: (e.clientX - r.left) * cam.width / r.width,
           y: (e.clientY - r.top) * cam.height / r.height,
           cx: e.clientX - r.left, cy: e.clientY - r.top };
}

function hoverHit(e) {
  const p = framePx(e);
  if (!p || !overlayFresh()) return null;
  for (const c of S.snap.contacts || []) {
    const b = c.bbox_xyxy;
    if (b && b.length === 4 && b[0] <= p.x && p.x <= b[2] && b[1] <= p.y && p.y <= b[3])
      return c;
  }
  return null;
}

function ripple(cx, cy) {
  const d = document.createElement("div");
  d.className = "ripple";
  d.style.left = cx + "px"; d.style.top = cy + "px";
  el("pov").appendChild(d);
  d.addEventListener("animationend", () => d.remove());
}

let toastTimer = 0;
function flashToast(text, cls) {
  const t = el("toast");
  t.textContent = text;
  t.className = "hud-dom toast " + (cls || "a");
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = "none"; }, 2600);
}

async function lockAt(x, y) {
  /* Click-to-lock: the SERVER hit-tests (W0.3); on 200 latch the reticle on
   * the contact until snap.track.target catches up; on 409 say why. */
  let r;
  try {
    r = await fetch("/api/lock", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ x, y }),
    });
  } catch (e) { flashToast("lock failed — server unreachable", "r"); return; }
  const j = await r.json().catch(() => ({}));
  if (r.ok) {
    S.locked = j.contact; S.lockedAt = performance.now();
    flashToast(`locked ${j.contact}`, "g");
    drawHUD();
  } else {
    flashToast({ miss: "no object there",
                 ambiguous: "ambiguous — zoom or wait",
                 stale: "stale video" }[j.reason] || `lock rejected (${r.status})`, "a");
  }
}

function updateLockUI(snap) {
  const t = snap && snap.track, target = t && t.target;
  if (target) {
    S.gap = t.gap_m;
    if (S.locked && target === S.locked) S.locked = null;   // authority caught up
  } else {
    S.orbit = null;
  }
  if (S.locked && performance.now() - S.lockedAt > 3000) S.locked = null;
  const pill = el("lockedpill"), bar = el("opsbar");
  if (!target) { pill.style.display = "none"; bar.style.display = "none"; return; }
  const gap = t.gap_m != null ? ` · gap ${t.gap_m.toFixed(1)} m` : "";
  /* HUD honesty (W3 codex §5): a click lock is a VISION lock — say so and
   * carry the beam's raw status (ToF SEARCHING/NO-RETURN/OUT-OF-ENVELOPE…);
   * RANGE LOCKED (green) is reserved for an actually LOCKED beam. */
  const st = snap.beam && snap.beam.status ? snap.beam.status : null;
  const ranged = st === "LOCKED";
  const beam = st ? ` · ToF ${st}` : "";
  pill.innerHTML = `<b>${ranged ? "RANGE LOCKED" : "VISION LOCK"}</b>${target}${gap}${beam}`;
  pill.className = "hud-dom trackbanner " + (ranged ? "g" : "a") + " lockedpill";
  pill.style.display = "block";
  bar.style.display = "flex";
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function setOrbitR(v) {
  S.orbitR = clamp(v, 8, 40);
  el("op-rval").textContent = `R ${S.orbitR} m`;
}

async function sendOp(op) {
  /* Locked-object op -> /api/cmd (schema-validated server-side, published
   * verbatim on /pilot/cmd). One op in flight at a time; result is transient. */
  const btns = el("opsbar").querySelectorAll("button");
  btns.forEach(b => b.disabled = true);
  try {
    const r = await fetch("/api/cmd", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(op),
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok) {
      S.orbit = op.op === "orbit" ? { contact: op.contact, radius_m: op.radius_m } : null;
      flashToast(`${op.op} sent${op.contact ? " · " + op.contact : ""}`, "g");
    } else {
      flashToast(`${op.op} rejected — ${j.error || r.status}`, "r");
    }
  } catch (e) {
    flashToast(`${op.op} failed — server unreachable`, "r");
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}

/* ---------------- PPI map ---------------- */

function drawPPI() {
  const cv = el("ppi"), ctx = cv.getContext("2d");
  const C = 110, R = 100;
  ctx.clearRect(0, 0, 220, 220);
  ctx.strokeStyle = "#1e2a52"; ctx.fillStyle = "#6b76a8";
  ctx.font = "9px ui-monospace, Menlo, monospace";
  for (const rm of [10, 20, 30]) {
    ctx.beginPath(); ctx.arc(C, C, R * rm / 35, 0, 7); ctx.stroke();
    ctx.fillText(rm + "m", C + 2, C - R * rm / 35 + 9);
  }
  const hdg = (S.state && S.state.heading) || 0;
  /* FOV cone: up = own heading (0=N, +CW); camera HFOV from the SDF */
  ctx.fillStyle = "#4cc3ff14";
  ctx.beginPath(); ctx.moveTo(C, C);
  ctx.arc(C, C, R, (-90 - HFOV_DEG / 2) * Math.PI / 180, (-90 + HFOV_DEG / 2) * Math.PI / 180);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#a3aede";
  ctx.beginPath(); ctx.moveTo(C, C); ctx.lineTo(C, C - R); ctx.stroke();   // heading tick
  ctx.beginPath(); ctx.arc(C, C, 3, 0, 7); ctx.stroke();                  // own ship

  for (const c of (S.snap && S.snap.contacts) || []) {
    if (c.bearing_deg == null) continue;
    /* bearing_deg is world-frame from-drone (0=N,+CW); rotate into heading-up */
    const rel = (c.bearing_deg - hdg) * Math.PI / 180;
    const ranged = c.range_m != null;
    const rr = ranged ? Math.min(R, R * c.range_m / 35) : R - 4;
    const x = C + rr * Math.sin(rel), y = C - rr * Math.cos(rel);
    const col = c.health === "MEASURED" ? "#3ddc97" : c.health === "COASTING" ? "#ffb454" : "#4cc3ff";
    ctx.strokeStyle = col; ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y, 4, 0, 7);
    ranged ? ctx.fill() : ctx.stroke();        // bearing-only: hollow blip at the edge
    const designated = S.snap.track && S.snap.track.target === c.name;
    if (designated) { ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.stroke(); }
    if (designated && S.orbit && S.orbit.contact === c.name) {
      ctx.setLineDash([4, 3]);                 // active orbit radius ring (W3b)
      ctx.beginPath(); ctx.arc(x, y, R * S.orbit.radius_m / 35, 0, 7); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

/* ---------------- chat + command + estop ---------------- */

function chatLine(text) {
  const d = document.createElement("div");
  d.className = text.startsWith("you:") ? "u" : text.startsWith("pilot:") ? "p"
              : text.startsWith("estop:") ? "e" : "s";
  d.textContent = text;
  return d;
}

async function pollChat() {
  try {
    const r = await fetch(`/chat?since=${S.chatNext}`);
    const j = await r.json();
    const box = el("chat");
    for (const line of j.lines) box.appendChild(chatLine(line));
    S.chatNext = j.next;
    box.scrollTop = box.scrollHeight;
  } catch (e) { /* next poll retries with the same cursor */ }
}

async function sendCommand() {
  const inp = el("cmd-in"), text = inp.value.trim();
  if (!text) return;
  inp.value = "";
  await fetch("/command", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }),
  });
  pollChat();
}

async function estop(action, btn) {
  btn.disabled = true;
  try {
    await fetch("/estop", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action }),
    });
    btn.classList.add("hit");
    setTimeout(() => btn.classList.remove("hit"), 1500);
  } finally {
    btn.disabled = false;
    pollChat();
  }
}

/* ---------------- clock + boot ---------------- */

function tickClock() {
  el("clock").textContent = S.lastStamp ? `SIM ${S.lastStamp.toFixed(1)}s` : "SIM —";
}

el("cmd-send").onclick = sendCommand;
el("cmd-in").addEventListener("keydown", (e) => { if (e.key === "Enter") sendCommand(); });
el("btn-estop").onclick = (e) => estop("hold", e.target);
el("btn-land").onclick = (e) => estop("land", e.target);

/* W3b: hover preview + click-to-lock + clickable contact list + ops bar */
el("pov").addEventListener("mousemove", (e) => {
  const h = hoverHit(e), key = h ? h.name : null;
  if (key !== S.hoverKey) { S.hoverKey = key; S.hover = h; drawHUD(); }
});
el("pov").addEventListener("mouseleave", () => {
  if (S.hoverKey !== null) { S.hoverKey = null; S.hover = null; drawHUD(); }
});
el("pov").addEventListener("click", (e) => {
  if (e.target.closest("#opsbar")) return;     // ops bar clicks aren't locks
  const p = framePx(e);
  if (!p) return;
  ripple(p.cx, p.cy);
  lockAt(p.x, p.y);
});
el("contacts").addEventListener("click", (e) => {
  const item = e.target.closest(".citem[data-name]");
  if (!item) return;
  const c = ((S.snap && S.snap.contacts) || []).find(c => c.name === item.dataset.name);
  if (!c || !c.bbox_xyxy) return;
  lockAt((c.bbox_xyxy[0] + c.bbox_xyxy[2]) / 2, (c.bbox_xyxy[1] + c.bbox_xyxy[3]) / 2);
});
el("op-orbit").onclick = () => {
  const c = curTarget();
  if (c) sendOp({ op: "orbit", contact: c, radius_m: S.orbitR, rate_dps: 8 });
};
/* R4: Approach/Back-off step ±3 m inside the 14-20 m stand-off band — the
 * H=4 m safe (H,R) pairs (R_min 12, shadow ring 14) keep the car out of the
 * level camera's blind cone; a click without a gap baseline sends the R4
 * demonstration pair (14 m / 18 m). The FlightOps radial floor remains the
 * final authority below 12 m. */
el("op-approach").onclick = () => {
  const c = curTarget();
  if (c) sendOp({ op: "standoff", contact: c,
                  range_m: Math.round(clamp((S.gap ?? 17) - 3, 14, 20) * 10) / 10 });
};
el("op-backoff").onclick = () => {
  const c = curTarget();
  if (c) sendOp({ op: "standoff", contact: c,
                  range_m: Math.round(clamp((S.gap ?? 15) + 3, 14, 20) * 10) / 10 });
};
el("op-stop").onclick = () => sendOp({ op: "stop" });
el("op-resume").onclick = () => {
  const c = curTarget();
  if (c) sendOp({ op: "resume", contact: c });
};
el("op-rdec").onclick = () => setOrbitR(S.orbitR - 5);
el("op-rinc").onclick = () => setOrbitR(S.orbitR + 5);

connectCam();
connectDet();
setInterval(pollState, 500);   pollState();
setInterval(pollChat, 1000);   pollChat();
setInterval(drawPPI, 250);
setInterval(tickClock, 250);
setInterval(drawSensors, 500);
</script>
</body>
