# evals/tasks/swarm/w4_double_intercept.yaml
# Cooperative dynamics: tag the courier (N edge) AND the rover (SE plaza)
# within 25s of each other. The sites are ~230m apart: a solo drone tags them
# >=45s apart (gate-verified null) — only a split fleet makes the window.
id: w4_double_intercept
target_layer: operator
suite: swarm
difficulty: {plan_depth: 3, coordination: 4, ambiguity: 2, spatial: 3, swarm: 4, dynamic: 3}
setup:
  world: dynamic
  n_drones: 2
  spawn: home
  seed_objects: []
prompt: "You operate BOTH drones. Two contacts must be tagged nearly
  simultaneously (within 25 seconds of each other): get a drone within 12 m of
  contact mov_0 (patrolling the far north) and within 12 m of contact mov_1
  (circling the plaza to your southeast). One drone cannot do both in time —
  split up, observe each contact's motion, and time your tags together."
budget: {wall_clock_s: 300, max_steps: 22}
oracle:
  - {check: alive}
  - {check: within_window, window_s: 25, events: [
      {type: intercept, mover: mov_0, tol_m: 12},
      {type: intercept, mover: mov_1, tol_m: 12}]}
  - {check: within_step_budget, max_steps: 22}
# Pilot strategy: simultaneous AMBUSH, not chase (gate run 1 confirmed the
# NOTE's serialization risk: sequential lead_chasers put the intercepts
# 34.6s apart). Movers are deterministic post-anchor (anchor at cell start,
# transcript t~0): mov_0 shuttles x=-40+4t on the N100 line; mov_1 walks
# angle 0.1t rad ccw from the east point of the r=35 circle at (70,-100).
# One goto_all parks drone 0 at (110,100) — mov_0 sweeps within 12m at
# t in [34.5,40.5] outbound and [49.5,55.5] returning — and drone 1 on the
# circle at angle 5.5 rad (94.8,-124.7), which mov_1 reaches at t=55+/-3.4.
# Measured fleet timing (gate run 1): airborne+speed by t~18, legs fly
# ~10 m/s +4s overhead, so both drones are parked by t~35-40; the hover
# holds BOTH in place through every pass window (later steps only move
# their own drone). Offline sweep of departure offsets -5..+15s keeps the
# two first-intercepts 2-18s apart (window 25s). The naive_chaser
# touch-ups are post-window insurance only.
# Pilot (2026-07-06): track_all replaced the timed-ambush script — two
# concurrent onboard pursuit controllers make the simultaneity trivial (both
# intercepts land seconds apart, far inside the 25s window; the ambush comment
# above is kept as the record of what discrete tools required). Altitudes
# split 12/14 as airspace hygiene.
pilot:
  - {tool: take_off, args: {altitude: 12}}
  - {tool: take_off, drone: 1, args: {altitude: 14}}
  - {tool: track_all, args: {tracks: [
      {drone: 0, target: mov_0, mode: intercept, alt: 12, within_m: 12, speed: 12, duration_s: 110},
      {drone: 1, target: mov_1, mode: intercept, alt: 14, within_m: 12, speed: 12, duration_s: 110}]}}
null_pilot:
  # solo attempt: tag the courier, then transit ~230m and tag the rover
  - {tool: take_off, args: {altitude: 12}}
  - {tool: set_speed, args: {speed: 12}}
  - {behavior: lead_chaser, args: {mover: mov_0, rounds: 3, lead_s: 8, alt: 12}}
  - {behavior: lead_chaser, args: {mover: mov_1, rounds: 5, lead_s: 8, alt: 12}}
# NOTE (resolved 2026-07-04): gate run 1 hit exactly the serialization
# failure predicted here (pilot 0/2: intercepts 34.6s apart / mov_1 never
# reached while drone 1 idled). The pilot above is the pre-authorized fix —
# a single goto_all to each mover's predicted pass point plus short
# naive_chaser touch-ups; the null_pilot is unchanged and still fails on
# the solo-transit gap.
