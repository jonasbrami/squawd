id: reach_marker_single
target_layer: single_drone
difficulty: {plan_depth: 1, coordination: 1, ambiguity: 1, spatial: 2}
setup:
  # Use a FLAT world (default/lawn). baylands has terrain elevation that offsets PX4's
  # local-altitude frame (~570 m) — take_off's altitude gate then trips instantly and the
  # drone never climbs. Verified 2026-07-01: this task PASSES on `default` (drone reached
  # 0.5 m from tgt_a), FAILS on baylands for that reason. See evals/README.md.
  world: default
  n_drones: 1
  spawn: home
  seed_objects:
    - {kind: marker, id: tgt_a, east: 120, north: -40}
prompt: "Take off to 12 m, then fly to the marker tgt_a located at world east 120, north -40, and hover there."
budget: {wall_clock_s: 120, max_steps: 20}
oracle:
  - {check: alive}
  - {check: reached, target: tgt_a, tol_m: 15}
  - {check: within_step_budget, max_steps: 20}
