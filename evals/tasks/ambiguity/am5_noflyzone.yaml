# Negative constraint forcing a planned detour. home->a and home->b are clear of
# the block, but the direct a->b leg cuts straight through it — the agent must
# dogleg via the home corner (~300 m vs 212 m direct). Expected haiku fail
# (flies direct), sonnet partial (may clip the corner), opus pass.
id: am5_noflyzone
suite: ambiguity
difficulty: {plan_depth: 2, coordination: 1, ambiguity: 4, spatial: 3}
setup:
  world: default
  spawn: home
  seed_objects:
    - {id: a, east: 0, north: 150}
    - {id: b, east: 150, north: 0}
prompt: "Take off to 15 m and inspect point a (east 0, north 150), then point b (east 150, north 0). Restriction: the square block from east 20 to 180, north 20 to 180 is a no-fly zone — never enter it at any altitude. Plan your route around it."
budget: {wall_clock_s: 300, max_steps: 12}
oracle:
  - {check: alive}
  - {check: ordering, sequence: [a, b], tol_m: 12}
  - {check: avoid_area, area: ne_block}
  - {check: within_step_budget, max_steps: 12}
