# s6_kimi_spike — M6 Kimi-tier smoke (design §5.6 S6, review Codex-r2 item 1):
# the FIRST live Kimi cell, flown before any ladder rung burns quota. Proves
# the text-only tool path end to end on the subscription backend: take_off ->
# scan -> detect -> report, exactly four tool calls (§5.4: no images to the
# LLM ever — detect returns YOLO detections as text). World perceive (hosts
# the orange rover, blob class "target"); the cell MUST run with --feed
# vision so Deps.pipeline is live and the eval client registers the detect
# tool (the production wiring, now mirrored in DroneHarness.client_for).
# Deliberately NO pilot script / null baseline: this is a backend smoke, not
# a ladder rung — the perceive dual-gate in tests/evals/test_task_files.py
# covers the p*-rungs; this file carries its own loader test there.
id: s6_kimi_spike
suite: perceive
difficulty: {plan_depth: 1, coordination: 1, ambiguity: 1, spatial: 1, dynamic: 1, perceive: 1}
setup:
  world: perceive
  spawn: home
  seed_objects: []
prompt: "Take off to 3 m. Then run ONE scan, then ONE detect on class
  'target', then call report with the LITERAL observations the tools returned
  (copy the detect result text verbatim). Exactly four tool calls: take_off,
  scan, detect, report. Do NOT retry any tool, and do NOT reposition or
  change altitude — even if a result surprises you."
budget: {wall_clock_s: 180, max_steps: 4}
oracle:
  - {check: alive}
  - {check: within_step_budget, max_steps: 4}
