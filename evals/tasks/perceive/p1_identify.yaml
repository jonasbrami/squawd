# p1_identify — perceive ladder L1 (M5, design §3.8): IDENTIFY the true target
# among visually distinct decoys, then shadow it. The world (perceive) hosts
# ONE orange rover (blob class "target") plus a RED tall hauler and a BLUE-GREY
# low sled — decoys differ in color AND shape because the blob backend cannot
# separate same-orange decoys (make_dynamic_world.py:55, Codex-Mj4). Grading is
# the perception act itself: identified_target passes only when the FIRST
# vis_* lock associates to mov_true in oracle truth at that sim moment (the
# TargetLockEvent path); dwell_moving then proves the shadow. Report text is
# never graded (§4.3).
# v1 honesty limit: with the single-class blob the decoys are invisible to the
# detector, so the must-FAIL baseline is the BLIND strategy (never locks);
# decoy-fooling cells arrive with the multi-class backend (M2.5+ ladder).
# LLM cells additionally need the detect tool wired in evals (M6 tier work);
# the pilot gate below is the scripted perception path (track_vis).
id: p1_identify
target_layer: single_drone
suite: perceive
difficulty: {plan_depth: 1, coordination: 1, ambiguity: 3, spatial: 2, dynamic: 2, perceive: 1}
setup:
  world: perceive
  n_drones: 1
  spawn: home
  seed_objects: []
prompt: "Several utility vehicles are working the plaza southeast of you.
  Your target is the ORANGE survey rover — a red tall hauler and a low
  blue-grey sled also move there and are NOT your target. Get close enough to
  see them, identify the rover with scan/detect (contact class 'target'), lock
  it with track (mode='shadow'), and stay within 15 m of it for 30 CONTINUOUS
  seconds."
budget: {wall_clock_s: 240, max_steps: 25}
oracle:
  - {check: alive}
  - {check: identified_target, truth: mov_true}
  - {check: dwell_moving, mover: mov_true, tol_m: 15, hold_s: 30}
  - {check: within_step_budget, max_steps: 25}
# Pilot (scripted perception, no LLM): transit to the plaza rim FIRST — from
# home the plaza is ~120 m out and outside the 69° FOV, so nothing is visible
# until the drone closes in. The vantage is alt 3 at (40,-70), NOT higher:
# from alt 6 the near arc of the rover's orbit sits below the 21° half-vFOV
# and the visible arc starts at ~56 m — the blob barely fires and no contact
# ever births (observed live 2026-07-22: 6/6 cells, 45 s polls, zero dets).
# From alt 3 the rover sweeps through 7-40 m in view and the blob fires
# strongly. max_range_m=25 makes the lock wait for a NEAR sighting: a far,
# shallow-angle first sighting (<6° depression, outside the M2/M3a projection
# envelope) seeds the EKF >25 m off and the TargetLockEvent association gate
# rightly rejects it ("locked vis_target_0 -> None", same live session).
# max_range_m=15 (close-lock): acquisitions only HOLD at close geometry —
# locks at 20-25 m dropped the contact mid-transit ('LOST: vis_target_N
# dropped from contacts >2.0s', 2026-07-22), so the pilot waits for a near
# pass (wait_s=60 spans the rover's 63 s orbit). Track at alt 3 (the
# M3a-proven shadow altitude).
pilot:
  - {tool: take_off, args: {altitude: 3}}
  - {tool: goto, args: {east: 40, north: -70, up: 3}}
  - {behavior: track_vis, args: {cls: target, mode: shadow, alt: 3, duration_s: 60, within_m: 15, wait_s: 60, poll_s: 3, max_range_m: 15}}
# Null (must FAIL): the blind strategy — flies out and holds without ever
# perceiving or locking anything. Fails identified_target (no vis_* lock) and
# dwell_moving (never near the rover).
null_pilot:
  - {tool: take_off, args: {altitude: 3}}
  - {tool: goto, args: {east: 40, north: -70, up: 3}}
  - {tool: hover, args: {seconds: 45}}
