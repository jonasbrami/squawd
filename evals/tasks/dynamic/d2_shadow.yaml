# L2 shadow the loop: 4 m/s rover on a 35 m circle, stay within 12 m for 45
# CONTIGUOUS seconds. Calibrated against the SCRIPTED naive chaser at 12 m/s
# legs (~2.5 s overhead each): its steady-state gap ~= 4*(gap/12 + 2.5) = 15 m
# — outside tolerance, dwell never accumulates (gate-verified) — while a one-
# leg-ahead extrapolation parks inside. No static point dwells: the rover
# crosses any fixed 12 m disc on its path in ~6 s.
id: d2_shadow
target_layer: single_drone
suite: dynamic
difficulty: {plan_depth: 2, coordination: 1, ambiguity: 2, spatial: 3, dynamic: 2}
setup:
  world: dynamic
  n_drones: 1
  spawn: home
  seed_objects: []
prompt: "A survey rover (contact mov_1) is driving a repeating route around
  the plaza southeast of you. Find it with scan, work out where it is heading,
  and shadow it: stay within 12 m of it for at least 45 continuous seconds.
  Aiming where it will be beats chasing where it was."
budget: {wall_clock_s: 240, max_steps: 30}
oracle:
  - {check: alive}
  - {check: dwell_moving, mover: mov_1, tol_m: 12, hold_s: 45}
  - {check: within_step_budget, max_steps: 30}
pilot:
  - {tool: take_off, args: {altitude: 12}}
  - {tool: set_speed, args: {speed: 12}}
  - {behavior: lead_chaser, args: {mover: mov_1, rounds: 25, lead_s: 5, alt: 12}}
null_pilot:
  - {tool: take_off, args: {altitude: 12}}
  - {tool: set_speed, args: {speed: 12}}
  - {behavior: naive_chaser, args: {mover: mov_1, rounds: 25, alt: 12}}
