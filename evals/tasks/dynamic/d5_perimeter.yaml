# L5 perimeter defense: intercept the inbound intruder BEFORE it comes within
# 50 m of the tower (zone deadline on the intercept check). ~50 s from spawn
# to the deadline; every wasted tool call is ~15-40 m of intruder progress —
# this rung measures deliberation efficiency under time pressure. Path budget
# kills the fast tail-chase, the deadline kills slow-but-clean.
id: d5_perimeter
suite: dynamic
difficulty: {plan_depth: 3, coordination: 1, ambiguity: 3, spatial: 4, dynamic: 5}
setup:
  world: dynamic
  spawn: home
  seed_objects:
    - {id: tower, east: -80, north: -80}
prompt: "URGENT: an intruder drone (contact mov_4) is inbound from the
  southwest toward the tower at E-80 N-80. Intercept it — get within 10 m —
  BEFORE it gets within 50 m of the tower. Fuel is limited: fly at most 320 m
  total. Every second counts."
budget: {wall_clock_s: 180, max_steps: 14}
oracle:
  - {check: alive}
  - {check: intercept, mover: mov_4, tol_m: 10, zone_target: tower, zone_radius_m: 50}
  - {check: path_length, max_m: 320}
  - {check: within_step_budget, max_steps: 14}
pilot:
  - {tool: take_off, args: {altitude: 12}}
  - {behavior: lead_intercept, args: {mover: mov_4, speed_mps: 12, obs_s: 5, alt: 12}}
  - {behavior: naive_chaser, args: {mover: mov_4, rounds: 2, alt: 12}}
null_pilot:
  - {tool: take_off, args: {altitude: 12}}
  - {tool: set_speed, args: {speed: 12}}
  - {behavior: naive_chaser, args: {mover: mov_4, rounds: 8, alt: 12}}
