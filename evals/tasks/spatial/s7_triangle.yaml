# Combinatorial geometry + distractors. Largest-area triple is p1,p4,p5
# (17000 m^2); runner-up p1,p2,p5 (14500). Trap: the longest pairwise edge is
# p1-p2 (251 m) but p2 is NOT in the answer — the "pick the farthest-apart
# points" heuristic gives a wrong triple. Decoy geometry verified: every transit
# leg among home/p1/p4/p5 (any visit order) stays >= 48 m from p2 and p3, so
# not_reached tol 25 cannot false-fire on a correct route; p3's best triangle
# (13500) stays below the runner-up. Expected sonnet knee (needs real shoelace
# computation, 17% margin).
id: s7_triangle
target_layer: single_drone
suite: spatial
difficulty: {plan_depth: 2, coordination: 1, ambiguity: 1, spatial: 7}
setup:
  world: default
  n_drones: 1
  spawn: home
  seed_objects:
    - {id: p1, east: -120, north: 0}
    - {id: p2, east: 130, north: 20}
    - {id: p3, east: 80, north: 35}
    - {id: p4, east: 0, north: 110}
    - {id: p5, east: 80, north: -100}
prompt: "Take off to 15 m. Of these five survey points — p1 (east -120, north 0), p2 (east 130, north 20), p3 (east 80, north 35), p4 (east 0, north 110), p5 (east 80, north -100) — exactly three form the triangle with the largest area. Visit those three points (any order) and do not fly to the other two. Hover at the last one."
budget: {wall_clock_s: 320, max_steps: 12}
oracle:
  - {check: alive}
  - {check: visited_all, targets: [p1, p4, p5], tol_m: 12}
  - {check: not_reached, target: p2, tol_m: 25}
  - {check: not_reached, target: p3, tol_m: 25}
  - {check: within_step_budget, max_steps: 12}
