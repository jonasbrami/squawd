# Arithmetic warm-up for the computed-target rungs: the answer point `mid` is a
# HIDDEN grading anchor (seed_objects feed only the oracle) — the agent must
# compute (100, -20) from the two beacons itself. Anchors the new ladder and
# validates hidden-object grading before the harder rungs.
id: s5_midpoint
suite: spatial
difficulty: {plan_depth: 1, coordination: 1, ambiguity: 1, spatial: 5}
setup:
  world: default
  spawn: home
  seed_objects:
    - {id: mid, east: 100, north: -20}
prompt: "Take off to 12 m, then fly to the point exactly midway between beacon a (east 40, north -80) and beacon b (east 160, north 40). Hover there."
budget: {wall_clock_s: 150, max_steps: 8}
oracle:
  - {check: alive}
  - {check: reached, target: mid, tol_m: 12}
  - {check: within_step_budget, max_steps: 8}
pilot:
  - {tool: take_off, args: {altitude: 12}}
  - {tool: goto, args: {east: 100, north: -20, up: 12}}
  - {tool: hover}
