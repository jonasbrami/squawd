id: s1_dist60
suite: spatial
difficulty: {plan_depth: 1, coordination: 1, ambiguity: 1, spatial: 1}
setup:
  world: default
  spawn: home
  seed_objects:
    - {id: tgt, east: 60, north: 0}
prompt: "Take off to 12 m and fly to the marker tgt at east 60, north 0. Hover there."
