# Route optimization under a path-length budget. Verified geometry: the prompt's
# listing order home->a->b->c->d->e->home is the WORST of all 120 tours (981 m);
# optimal is a,c,e,b,d (574 m, = nearest-neighbour from home); only 14/120 orders
# come in under 700 m — passing requires actually ordering the route. The visit
# order is deliberately NOT graded; the path budget is the point. `final_pos`
# grades the return leg (reached-at-home is trivially true at spawn). Oracle max
# 720 m leaves ~3% sampling/overshoot slack over the prompt's 700 — calibrate
# against a reference run. Expected haiku fail (executes listed order), sonnet
# partial (passes iff it thinks to reorder), opus pass.
id: p5_tsp5
suite: plan_depth
difficulty: {plan_depth: 4, coordination: 1, ambiguity: 2, spatial: 4}
setup:
  world: default
  spawn: home
  seed_objects:
    - {id: a, east: 100, north: 0}
    - {id: b, east: -80, north: 60}
    - {id: c, east: 90, north: 80}
    - {id: d, east: -70, north: -50}
    - {id: e, east: 20, north: 120}
    - {id: home_pt, east: 0, north: 0}
prompt: "Take off to 15 m and visit all five checkpoints — a (east 100, north 0), b (east -80, north 60), c (east 90, north 80), d (east -70, north -50), e (east 20, north 120) — then return to home (east 0, north 0). Battery is limited: keep your total flight distance under 700 metres, so plan the visit order before you fly."
budget: {wall_clock_s: 420, max_steps: 16}
oracle:
  - {check: alive}
  - {check: visited_all, targets: [a, b, c, d, e], tol_m: 12}
  - {check: final_pos, target: home_pt, tol_m: 15}
  - {check: path_length, max_m: 720}
  - {check: within_step_budget, max_steps: 16}
