# p3's 4-corner patrol under a WASTE-FREE step budget: the pilot needs 6 steps;
# 8 allows exactly the habitual ToolSearch + report and NOTHING else. Any scan,
# re-issued goto, or exploratory action fails the budget — punishes verbosity
# and rewards one-shot planning (sonnet averaged 8-9 steps on p3-class tasks).
id: p6_tight_route
suite: plan_depth
difficulty: {plan_depth: 4, coordination: 1, ambiguity: 1, spatial: 2}
setup:
  world: default
  spawn: home
  seed_objects:
    - {id: a, east: 60, north: 0}
    - {id: b, east: 60, north: 60}
    - {id: c, east: 0, north: 60}
    - {id: d, east: 0, north: 0}
prompt: "Take off to 12 m, then patrol these points in order, returning to the last: a (east 60, north 0), b (east 60, north 60), c (east 0, north 60), d (east 0, north 0). Your action budget is very tight — no wasted moves."
budget: {wall_clock_s: 220, max_steps: 8}
oracle:
  - {check: alive}
  - {check: ordering, sequence: [a, b, c, d], tol_m: 12}
  - {check: within_step_budget, max_steps: 8}
pilot:
  - {tool: take_off, args: {altitude: 12}}
  - {tool: goto, args: {east: 60, north: 0, up: 12}}
  - {tool: goto, args: {east: 60, north: 60, up: 12}}
  - {tool: goto, args: {east: 0, north: 60, up: 12}}
  - {tool: goto, args: {east: 0, north: 0, up: 12}}
  - {tool: hover}
