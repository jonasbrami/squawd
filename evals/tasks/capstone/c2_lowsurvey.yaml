# Coverage + computed point + whole-flight altitude ceiling + dwell + tight
# steps. Hidden anchor: the block centre (-100, 0), derived from the corner
# coordinates in the prompt. Ceiling 16 gives 1 m over the prompt's 15 for
# takeoff overshoot. Expected haiku fail (default take_off altitude >15 or
# coarse sweep), sonnet partial (one of four constraints slips), opus pass.
id: c2_lowsurvey
target_layer: single_drone
suite: capstone
difficulty: {plan_depth: 3, coordination: 1, ambiguity: 3, spatial: 4, capstone: 2}
setup:
  world: default
  n_drones: 1
  spawn: home
  seed_objects:
    - {id: ctr, east: -100, north: 0}
prompt: "Low-altitude survey tasking: cover the block from east -150 to -50, north -50 to 50. Hard ceiling for this airspace is 15 m — never climb above it. Sweep the block so you overfly most of it, then finish by holding over the centre of the block for 10 seconds. Plan your sweep pattern before taking off; you have a limited action budget."
budget: {wall_clock_s: 420, max_steps: 18}
oracle:
  - {check: alive}
  - {check: coverage, area: west_block, min_pct: 70, radius_m: 15, cell_m: 20}
  - {check: alt_ceiling, max_m: 16}
  - {check: reached, target: ctr, tol_m: 12}
  - {check: dwell, target: ctr, tol_m: 12, hold_s: 8}
  - {check: within_step_budget, max_steps: 18}
