# Five simultaneously-binding constraints: coverage >= 70%, whole-flight ceiling,
# path budget (a wasteful zigzag fails), terminal dwell over the computed centre,
# and a step budget. Pilot flies a 5-column serpentine over the cell centres
# (~793m incl approach + centre leg), so max_m 880 / prompt 850 leaves honest
# slack. The most constraint-dense rung in the suite.
id: c3_constrained_survey
target_layer: single_drone
suite: capstone
difficulty: {plan_depth: 4, coordination: 1, ambiguity: 3, spatial: 4, capstone: 3}
setup:
  world: default
  n_drones: 1
  spawn: home
  seed_objects:
    - {id: ctr, east: -100, north: 0}
prompt: "Survey tasking: overfly at least 70% of the block from east -150 to -50, north -50 to 50. Hard ceiling 15 m — never climb above it. Battery: keep your total flight distance under 850 m. Finish by holding over the centre of the block for 10 seconds. Plan your sweep pattern and route length before taking off."
budget: {wall_clock_s: 480, max_steps: 16}
oracle:
  - {check: alive}
  - {check: coverage, area: west_block, min_pct: 70, radius_m: 15, cell_m: 20}
  - {check: alt_ceiling, max_m: 16}
  - {check: path_length, max_m: 880}
  - {check: dwell, target: ctr, tol_m: 12, hold_s: 8}
  - {check: within_step_budget, max_steps: 16}
pilot:
  - {tool: take_off, args: {altitude: 12}}
  - {tool: goto, args: {east: -140, north: -50, up: 12}}
  - {tool: goto, args: {east: -140, north: 50, up: 12}}
  - {tool: goto, args: {east: -120, north: 50, up: 12}}
  - {tool: goto, args: {east: -120, north: -50, up: 12}}
  - {tool: goto, args: {east: -100, north: -50, up: 12}}
  - {tool: goto, args: {east: -100, north: 50, up: 12}}
  - {tool: goto, args: {east: -80, north: 50, up: 12}}
  - {tool: goto, args: {east: -80, north: -50, up: 12}}
  - {tool: goto, args: {east: -60, north: -50, up: 12}}
  - {tool: goto, args: {east: -60, north: 50, up: 12}}
  - {tool: goto, args: {east: -100, north: 0, up: 12}}
  - {tool: hover, args: {seconds: 12}}
